<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="mexSky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="38%" stop-color="#EAF6FF"/>
      <stop offset="100%" stop-color="#7FD6FF"/>
    </linearGradient>
    <linearGradient id="water2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8ECFF"/>
      <stop offset="100%" stop-color="#2EB8F0"/>
    </linearGradient>
    <linearGradient id="glassL2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A4DCA"/>
      <stop offset="30%" stop-color="#1E6FFF"/>
      <stop offset="60%" stop-color="#3A8BFF"/>
      <stop offset="100%" stop-color="#082E8A"/>
    </linearGradient>
    <linearGradient id="glassR2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#082E8A"/>
      <stop offset="40%" stop-color="#1E6FFF"/>
      <stop offset="70%" stop-color="#0A4DCA"/>
      <stop offset="100%" stop-color="#05215E"/>
    </linearGradient>
    <linearGradient id="glassHl2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.88"/>
      <stop offset="24%" stop-color="white" stop-opacity="0.42"/>
      <stop offset="48%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hatCrown2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5E2C3"/>
      <stop offset="100%" stop-color="#D8B48A"/>
    </linearGradient>
    <linearGradient id="hatBrim2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF2DC"/>
      <stop offset="100%" stop-color="#D2B48C"/>
    </linearGradient>
  </defs>
  <!-- background -->
  <rect width="64" height="64" rx="13" fill="url(#mexSky2)"/>
  <!-- water -->
  <rect x="0" y="39" width="64" height="25" rx="13" fill="url(#water2)"/>
  <rect x="0" y="39" width="64" height="9" fill="#B8ECFF" opacity="0.85"/>
  <!-- sand island -->
  <ellipse cx="32" cy="47" rx="21.5" ry="5.8" fill="#0A2340" opacity="0.13"/>
  <ellipse cx="32" cy="45.8" rx="18.5" ry="4.4" fill="#F0E0C2"/>
  <ellipse cx="32" cy="44.8" rx="16" ry="2.9" fill="#FFF8E8" opacity="0.95"/>
  <!-- LEFT pillar - now tilted INWARD (top to right) to form M, not V -->
  <g transform="rotate(8.5 22.8 31.5)">
    <rect x="13.8" y="11.2" width="17.8" height="36.2" rx="8.9" fill="url(#glassL2)"/>
    <rect x="13.8" y="11.2" width="17.8" height="36.2" rx="8.9" fill="url(#glassHl2)"/>
    <!-- left edge highlight -->
    <rect x="15.6" y="14.5" width="3.0" height="25" rx="1.5" fill="white" opacity="0.52"/>
    <!-- right edge depth -->
    <rect x="25.5" y="12.5" width="2.4" height="32" rx="1.2" fill="#05215E" opacity="0.26"/>
  </g>
  <!-- RIGHT pillar - tilted INWARD (top to left) -->
  <g transform="rotate(-8.5 41.2 31.5)">
    <rect x="32.2" y="11.2" width="17.8" height="36.2" rx="8.9" fill="url(#glassR2)"/>
    <rect x="32.2" y="11.2" width="17.8" height="36.2" rx="8.9" fill="url(#glassHl2)"/>
    <rect x="33.9" y="14.5" width="3.0" height="25" rx="1.5" fill="white" opacity="0.48"/>
    <rect x="32.2" y="12.5" width="2.2" height="32" rx="1.1" fill="#05215E" opacity="0.20"/>
  </g>
  <!-- subtle contact shadow -->
  <ellipse cx="32" cy="46.2" rx="9.5" ry="1.6" fill="#0A2340" opacity="0.16"/>
  <!-- straw hat - centered on LEFT peak (now at ~25.5, 12) -->
  <g transform="translate(15.0 4.8) rotate(-12)">
    <!-- hat shadow on blue -->
    <ellipse cx="10" cy="13.2" rx="10.5" ry="2.8" fill="#082E8A" opacity="0.22"/>
    <!-- brim -->
    <ellipse cx="10" cy="12.2" rx="12.8" ry="4.4" fill="#8B6A3A" opacity="0.20"/>
    <ellipse cx="10" cy="11" rx="12.4" ry="4.2" fill="url(#hatBrim2)" stroke="#C9A87A" stroke-width="0.45"/>
    <ellipse cx="10" cy="10.1" rx="9.6" ry="3.1" fill="#E8D5B5"/>
    <!-- crown -->
    <path d="M3.6 10.1 C3.6 4.0 5.4 0.9 10 0.9 C14.6 0.9 16.4 4.0 16.4 10.1 Z" fill="url(#hatCrown2)" stroke="#C9A87A" stroke-width="0.45"/>
    <ellipse cx="10" cy="2.7" rx="5.0" ry="1.5" fill="white" opacity="0.42"/>
    <!-- band -->
    <path d="M3.7 8.1 H16.3 V10.6 H3.7 Z" fill="#D8B48A"/>
    <path d="M3.7 8.1 H16.3 V9.0 H3.7 Z" fill="#B8956A"/>
    <!-- weave lines -->
    <path d="M6.1 3.4 C6.9 5.0 7.4 7.0 7.1 10" stroke="#C9A87A" stroke-width="0.32" fill="none" opacity="0.55"/>
    <path d="M10 2.7 C10.3 5.0 10.4 7.3 10 10.1" stroke="#C9A87A" stroke-width="0.32" fill="none" opacity="0.55"/>
    <path d="M13.7 3.7 C13.1 5.4 12.6 7.3 12.5 10" stroke="#C9A87A" stroke-width="0.32" fill="none" opacity="0.55"/>
  </g>
  <rect width="64" height="64" rx="13" fill="none" stroke="rgba(0,0,0,0.05)" stroke-width="1"/>
</svg>
